name: ModelForge AI CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-and-test:
    name: Backend Lint, Type Check & Pytest Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelforge_user
          POSTGRES_PASSWORD: modelforge_password
          POSTGRES_DB: modelforge_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov flake8 black isort

      - name: Lint with Flake8
        run: |
          flake8 backend/app backend/ml_engine --max-line-length=120 --ignore=E203,W503,F401,F841 || true

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://modelforge_user:modelforge_password@localhost:5432/modelforge_db
          DATABASE_URL_SYNC: postgresql://modelforge_user:modelforge_password@localhost:5432/modelforge_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_secret_key_modelforge_testing_at_least_32_chars
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov=ml_engine

  frontend-build:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Next.js
        run: |
          cd frontend
          npm run build
