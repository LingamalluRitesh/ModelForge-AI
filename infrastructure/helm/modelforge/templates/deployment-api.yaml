apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modelforge.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "modelforge.name" . }}-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "modelforge.name" . }}-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "modelforge.name" . }}-backend
    spec:
      containers:
        - name: backend-api
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "modelforge.fullname" . }}-config
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
