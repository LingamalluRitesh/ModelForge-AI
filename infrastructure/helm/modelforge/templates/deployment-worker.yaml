apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modelforge.fullname" . }}-celery-worker
  labels:
    app.kubernetes.io/name: {{ include "modelforge.name" . }}-celery-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.celeryWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "modelforge.name" . }}-celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "modelforge.name" . }}-celery-worker
    spec:
      containers:
        - name: celery-worker
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.celeryWorker.image.repository }}:{{ .Values.celeryWorker.image.tag }}"
          imagePullPolicy: {{ .Values.celeryWorker.image.pullPolicy }}
          command:
            - celery
            - -A
            - app.worker.celery_app
            - worker
            - -l
            - info
            - -c
            - "{{ .Values.celeryWorker.concurrency }}"
          envFrom:
            - configMapRef:
                name: {{ include "modelforge.fullname" . }}-config
          resources:
            {{- toYaml .Values.celeryWorker.resources | nindent 12 }}
