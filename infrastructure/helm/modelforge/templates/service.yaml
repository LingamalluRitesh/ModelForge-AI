apiVersion: v1
kind: Service
metadata:
  name: {{ include "modelforge.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "modelforge.name" . }}-backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "modelforge.name" . }}-backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "modelforge.fullname" . }}-frontend
  labels:
    app.kubernetes.io/name: {{ include "modelforge.name" . }}-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "modelforge.name" . }}-frontend
