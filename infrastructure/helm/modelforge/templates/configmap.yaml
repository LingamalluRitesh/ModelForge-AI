apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "modelforge.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "modelforge.name" . }}
data:
  ENVIRONMENT: {{ .Values.backend.env.ENVIRONMENT | quote }}
  LOG_LEVEL: {{ .Values.backend.env.LOG_LEVEL | quote }}
  DATABASE_URL: {{ .Values.backend.env.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.backend.env.REDIS_URL | quote }}
  STORAGE_TYPE: {{ .Values.backend.env.STORAGE_TYPE | quote }}
  S3_BUCKET_NAME: {{ .Values.backend.env.S3_BUCKET_NAME | quote }}
  DOMAIN: {{ .Values.global.domain | quote }}
