apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modelforge.fullname" . }}-ray-head
  labels:
    {{- include "modelforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: ray-head
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "modelforge.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ray-head
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "modelforge.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ray-head
    spec:
      containers:
        - name: ray-head
          image: "rayproject/ray:2.9.0-py310"
          command: ["/bin/bash", "-c", "ray start --head --port=6379 --dashboard-host=0.0.0.0 --block"]
          ports:
            - containerPort: 6379
              name: client
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: ray-client
          resources:
            limits:
              cpu: 4000m
              memory: 16Gi
            requests:
              cpu: 2000m
              memory: 8Gi
