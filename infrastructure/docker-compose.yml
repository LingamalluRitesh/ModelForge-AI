version: "3.9"

services:
  # Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: modelforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: modelforge_user
      POSTGRES_PASSWORD: modelforge_password
      POSTGRES_DB: modelforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelforge_user -d modelforge_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Broker
  redis:
    image: redis:7.2-alpine
    container_name: modelforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3 Object Storage
  minio:
    image: minio/minio:latest
    container_name: modelforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Backend FastAPI API Gateway
  api:
    build:
      context: ../backend
      dockerfile: ../infrastructure/docker/Dockerfile.api
    container_name: modelforge-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://modelforge_user:modelforge_password@postgres:5432/modelforge_db
      DATABASE_URL_SYNC: postgresql://modelforge_user:modelforge_password@postgres:5432/modelforge_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_PROVIDER: local
      SECRET_KEY: modelforge_enterprise_super_secret_key_production_32chars
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/data_storage

  # Celery Asynchronous Workers
  worker:
    build:
      context: ../backend
      dockerfile: ../infrastructure/docker/Dockerfile.worker
    container_name: modelforge-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://modelforge_user:modelforge_password@postgres:5432/modelforge_db
      DATABASE_URL_SYNC: postgresql://modelforge_user:modelforge_password@postgres:5432/modelforge_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_PROVIDER: local
    volumes:
      - storage_data:/app/data_storage

  # Prometheus Telemetry & Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: modelforge-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  # Next.js Frontend Dashboard
  frontend:
    build:
      context: ../frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: modelforge-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  storage_data:
