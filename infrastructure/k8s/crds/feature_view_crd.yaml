apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: featureviewcomputes.ai.modelforge
  labels:
    app.kubernetes.io/name: modelforge-operator
    app.kubernetes.io/part-of: modelforge-platform
spec:
  group: ai.modelforge
  names:
    kind: FeatureViewCompute
    listKind: FeatureViewComputeList
    plural: featureviewcomputes
    singular: featureviewcompute
    shortNames:
      - fvc
      - fview
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: FeatureViewCompute defines an immutable AS-OF Point-In-Time feature calculation job.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - entityName
                - joinKey
                - transformationSql
              properties:
                entityName:
                  type: string
                joinKey:
                  type: string
                ttlSeconds:
                  type: integer
                  default: 86400
                onlineStorage:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    redisCluster:
                      type: string
                      default: "modelforge-redis:6379"
                offlineStorage:
                  type: object
                  properties:
                    tableName:
                      type: string
                    format:
                      type: string
                      enum: [parquet, delta, iceberg]
                      default: parquet
                transformationSql:
                  type: string
                  description: AS-OF temporal join query preventing future lookahead leakage.
                syncSchedule:
                  type: string
                  description: Cron expression for periodic batch synchronization.
                  default: "0 */1 * * *"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Idle, Materializing, Synced, Error]
                lastSyncTime:
                  type: string
                  format: date-time
                recordsMaterialized:
                  type: integer
                onlineMemoryBytes:
                  type: integer
