global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "modelforge-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "modelforge-postgres"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "modelforge-redis"
    static_configs:
      - targets: ["redis:6379"]
