apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelforge-api
  labels:
    app.kubernetes.io/name: modelforge-api
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: modelforge-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modelforge-api
    spec:
      containers:
        - name: api
          image: modelforge/api:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: modelforge-config
            - secretRef:
                name: modelforge-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelforge-worker
  labels:
    app.kubernetes.io/name: modelforge-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: modelforge-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modelforge-worker
    spec:
      containers:
        - name: worker
          image: modelforge/worker:latest
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          envFrom:
            - configMapRef:
                name: modelforge-config
            - secretRef:
                name: modelforge-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: modelforge-api-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: modelforge-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: modelforge-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: modelforge-api
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
